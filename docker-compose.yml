version: '3.8'

services:
  postgres:
    image: timescale/timescaledb:latest-pg15
    container_name: kronos-postgres
    environment:
      POSTGRES_USER: kronos
      POSTGRES_PASSWORD: kronos
      POSTGRES_DB: kronos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kronos"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: kronos-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio
    container_name: kronos-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  kronos:
    build:
      context: ./kronos
      dockerfile: Dockerfile
    container_name: kronos-service
    ports:
      - "8001:8001"
    depends_on:
      - redis
    environment:
      - REDIS_HOST=redis
    volumes:
      - ./kronos/models:/app/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  hermes-agent:
    image: python:3.11-slim
    container_name: hermes-agent
    command: /bin/bash -c "cd /app && pip install -e . && sleep infinity"
    volumes:
      - /workspace/hermes-agent:/app
      - hermes_home:/root/.hermes
    environment:
      - HERMES_HOME=/root/.hermes
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "python", "-c", "from run_agent import AIAgent; print('Hermes Agent OK')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kronos-backend
    ports:
      - "8000:8000"
    depends_on:
      - kronos
      - redis
      - postgres
      - hermes-agent
    environment:
      - KRONOS_SERVICE_URL=http://kronos:8001
      - POSTGRES_SERVER=postgres
      - REDIS_HOST=redis
      - HERMES_AGENT_PATH=/app/hermes-agent
      - HERMES_PROVIDER=openrouter
      - HERMES_MODEL=anthropic/claude-3.5-sonnet
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
    volumes:
      - /workspace/hermes-agent:/app/hermes-agent
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kronos-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  minio_data:
  hermes_home:
